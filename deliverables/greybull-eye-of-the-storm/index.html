const audio = {
  ctx: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.9; this.master.connect(c.destination);
    // background score: a slow, tense pad (Am - F - C - G) plus a pulse that quickens near the surge peak
    const lpm = c.createBiquadFilter(); lpm.type = 'lowpass'; lpm.frequency.value = 700;
    this.music = c.createGain(); this.music.gain.value = 0; lpm.connect(this.music); this.music.connect(this.master);
    this.pad = [0, 1, 2, 3].map(i => { const o = c.createOscillator(); o.type = 'sawtooth'; o.detune.value = (i - 1.5) * 7; o.connect(lpm); o.start(); return o; });
    this.chord = -1; this.beatT = 0;
    this.voiceOut = c.createGain(); this.voiceOut.gain.value = 1.1; this.voiceOut.connect(this.master);
    const hp2 = c.createBiquadFilter(); hp2.type = 'highpass'; hp2.frequency.value = 350;
    const bp = c.createBiquadFilter(); bp.type = 'peaking'; bp.frequency.value = 1800; bp.gain.value = 6;
    hp2.connect(bp); bp.connect(this.voiceOut); this.radioIn = hp2;
    this.clips = {};
    for (const k in VOICE) {
      const bin = atob(VOICE[k]), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      try { const pr = c.decodeAudioData(u8.buffer, buf => { this.clips[k] = buf; }, () => {}); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {}
    }
    const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);

  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(700, 470, 300, 'rgba(255,170,90,A)', 0.35); ctx.restore();
  ctx.fillStyle = '#0d1219';
  for (const b of SKYLINE) if (b.x < VW) ctx.fillRect(b.x, 470 - b.h * 0.8, b.w, b.h * 0.8 + 80);
  ctx.fillRect(0, 468, VW, 80);
  ctx.fillStyle = 'rgba(4,7,11,0.55)'; ctx.fillRect(0, 0, VW, VH);
  const all = F && F.saved >= survivors.length;
  txt(all ? 'MISSION COMPLETE' : 'SURGE PEAK REACHED', 60, 76, all ? 40 : 34, '#f3f6f9', 'left', 900);
  txt('OPERATION HURRICANE', 62, 102, 13, ORANGE, 'left', 800);
  const n = stars();
  for (let i = 0; i < 3; i++) drawStar(84 + i * 52, 150, 22, i < n && t > 0.3 + i * 0.3);
  const rows = [['Lives saved', `${F ? F.saved : 0} / ${survivors.length}`], ['Storm clock left', fmtTime(F ? Math.max(0, STORM_TIME - F.t) : 0)], ['Close calls', String(F ? F.bumps : 0)], ['Gusts weathered', String(F ? F.gusts : 0)], ['Loadout', picked.map(k => KIT.find(x => x.k === k).name).join(' + ')]];
  rows.forEach(([a, b], i) => { txt(a, 62, 210 + i * 30, 15, '#9fb3c6', 'left', 600); txt(b, 430, 210 + i * 30, 15, '#f3f6f9', 'right', 800); });
  panel(62, 362, 368, 72, 10, ORANGE);
  txt(all ? 'BRYAN · PROMOTED: RECRUIT → OPERATOR' : 'BRYAN · YOUR COACH', 76, 382, 11, ORANGE, 'left', 800);
  drawWrapped(all ? '"All 15 home, and Sarah just heard her parents\' voices. Welcome to the team, Operator."' : `"Good first mission, recruit. High-water teams reached the other ${survivors.length - (F ? F.saved : 0)} at first light. Let's run it again."`, 76, 403, 340, 14, '#eef2f6', 19);
  panel(480, 40, 430, 380, 14);
  txt('THE REAL MISSION', 504, 72, 13, ORANGE, 'left', 900);
  txt('Hurricane Helene · Florida, 2024', 504, 98, 18, '#f3f6f9', 'left', 800);
  const story = 'When Hurricane Helene\'s storm surge flooded Florida\'s Gulf Coast in September 2024, Grey Bull Rescue teams went where first responders couldn\'t reach. In South Tampa they waded through floodwater with inflatable kayaks to save a family, two babies and two dogs after saltwater flooding set their home on fire. They answered calls on Siesta Key, then shifted from rescue to recovery. The team has also responded to Hurricanes Ian and Milton.';
  drawWrapped(story, 504, 128, 384, 15, '#c3cfda', 22);
  txt('The helicopter hoist scenes are dramatized for this game.', 504, 400, 12, '#6d7b87', 'left', 500);
  button(480, 444, 270, 56, 'FUND THE NEXT RESCUE', () => window.open('https://greybullrescue.org/fund-our-missions/', '_blank', 'noopener'), { size: 18 });
  button(762, 444, 148, 56, 'PLAY AGAIN', () => { picked = []; go('title'); }, { fill: '#24323f', col: '#f3f6f9', size: 16 });
  txt('Every real rescue is funded by donors like you.', 62, 470, 14, '#a9b6c3', 'left', 500);
}

// ---------------------------------------------------------------- loop ----
function update(dt) {
  sceneT += dt;
  if (scene === 'fly') updFly(dt);
  else windNow = 55 + Math.sin(sceneT * 0.5) * 25;
  if (scene === 'ops') opsT += dt;
  if (scene === 'deploy' && sceneT > 6.4) go('fly');
  updWeather(dt, scene === 'fly' || scene === 'title');
  const flying = scene === 'fly' && F && !F.heli.landed;
  audio.level('rotor', scene === 'fly' ? (flying ? 0.5 : 0.22) : 0);
  audio.score(dt, scene === 'fly' ? 0.07 : scene === 'debrief' ? 0.04 : 0.05, scene === 'fly' && F && STORM_TIME - F.t < 60 && !F.endT);
  audio.level('rain', scene === 'fly' ? 0.1 : scene === 'title' ? 0.08 : scene === 'ops' ? 0.03 : 0.02);
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#05080c'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  ui = [];
  if (scene === 'title') { drawTitle(sceneT); post(); drawMute(); }
  else if (scene === 'ops') { drawOps(sceneT); post(); drawMute(); }
  else if (scene === 'loadout') { drawLoadout(sceneT); post(); drawMute(); }
  else if (scene === 'deploy') { drawDeploy(sceneT); post(); drawMute(); }
  else if (scene === 'fly') drawFly();
  else if (scene === 'debrief') { drawDebrief(sceneT); post(); drawMute(); }
  ctx.restore();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { go, get F() { return F; }, get scene() { return scene; }, get survivors() { return survivors; }, setPicked(p) { picked = p; }, update, keys, audio };
</script>
