function mapProj(v, r) { return (lon, lat) => [r.x + (lon - v.lon0) / (v.lon1 - v.lon0) * r.w, r.y + (v.lat1 - lat) / (v.lat1 - v.lat0) * r.h]; }
function drawMap(v, r, o = {}) {

  for (let lon = Math.ceil(v.lon0); lon <= v.lon1; lon++) { const [x] = P(lon, 0); ctx.moveTo(x, r.y); ctx.lineTo(x, r.y + r.h); }
  for (let lat = Math.ceil(v.lat0); lat <= v.lat1; lat++) { const [, y] = P(0, lat); ctx.moveTo(r.x, y); ctx.lineTo(r.x + r.w, y); }

  const path = () => { ctx.beginPath(); for (const ring of polys) { ring.forEach(([lo, la], i) => { const [x, y] = P(lo, la); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); } };
  ctx.lineJoin = 'round';
  path(); ctx.strokeStyle = 'rgba(60,150,170,0.16)'; ctx.lineWidth = o.shelf || 14; ctx.stroke();
  ctx.strokeStyle = 'rgba(80,170,190,0.2)'; ctx.lineWidth = (o.shelf || 14) * 0.45; ctx.stroke();
  const lg = ctx.createLinearGradient(r.x, r.y, r.x + r.w * 0.6, r.y + r.h); lg.addColorStop(0, '#2c4a35'); lg.addColorStop(1, '#1d3527');
  path(); ctx.fillStyle = lg; ctx.fill();

}

  ctx.save(); ctx.globalAlpha = a;

  const rows = [['Lives saved', `${F ? F.saved : 0} / ${survivors.length}`], ['Storm clock left', fmtTime(F ? Math.max(0, STORM_TIME - F.t) : 0)], ['Close calls', String(F ? F.bumps : 0)], ['Gusts weathered', String(F ? F.gusts : 0)], ['Loadout', picked.map(k => KIT.find(x => x.k === k).name).join(' + ')]];
  rows.forEach(([a, b], i) => { txt(a, 62, 210 + i * 30, 15, '#9fb3c6', 'left', 600); txt(b, 430, 210 + i * 30, 15, '#f3f6f9', 'right', 800); });
  panel(62, 362, 368, 72, 10, ORANGE);
  txt(all ? 'BRYAN · PROMOTED: RECRUIT → OPERATOR' : 'BRYAN · YOUR COACH', 76, 382, 11, ORANGE, 'left', 800);
  drawWrapped(all ? '"We don\'t come home until they come home. All 15 are home. Welcome to the team, Operator."' : `"Good first mission, recruit. High-water teams reached the other ${survivors.length - (F ? F.saved : 0)} at first light. Let's run it again."`, 76, 403, 340, 14, '#eef2f6', 19);
  panel(480, 40, 430, 380, 14);
  txt('THE REAL MISSION', 504, 72, 13, ORANGE, 'left', 900);
  txt('Hurricane Helene · Florida, 2024', 504, 98, 18, '#f3f6f9', 'left', 800);
  const story = 'When Hurricane Helene\'s storm surge flooded Florida\'s Gulf Coast in September 2024, Grey Bull Rescue teams went where first responders couldn\'t reach. In South Tampa they waded through floodwater with inflatable kayaks to save a family, two babies and two dogs after saltwater flooding set their home on fire. They answered calls on Siesta Key, then shifted from rescue to recovery. The team has also responded to Hurricanes Ian and Milton.';
  drawWrapped(story, 504, 128, 384, 15, '#c3cfda', 22);
  txt('The helicopter hoist scenes are dramatized for this game.', 504, 400, 12, '#6d7b87', 'left', 500);
  button(480, 444, 270, 56, 'FUND THE NEXT RESCUE', () => window.open('https://greybullrescue.org/fund-our-missions/', '_blank', 'noopener'), { size: 18 });
  button(762, 444, 148, 56, 'PLAY AGAIN', () => { picked = []; go('title'); }, { fill: '#24323f', col: '#f3f6f9', size: 16 });
  txt("DON'T BE A SPECTATOR.", 62, 474, 24, ORANGE, 'left', 900);
  txt('Every real rescue is funded by donors like you.', 62, 496, 13, '#a9b6c3', 'left', 500);
}

// ---------------------------------------------------------------- loop ----
function update(dt) {
  sceneT += dt;
  if (scene === 'fly') updFly(dt);
  else windNow = 55 + Math.sin(sceneT * 0.5) * 25;
  if (scene === 'ops') { opsT += dt; if (SCRIPT[opsIdx] && SCRIPT[opsIdx].answer) { ringT -= dt; if (ringT <= 0) { ringT = 2.6; audio.ring(); } } }
  if (scene === 'intro') updIntro();
  if (scene === 'debrief' && !debriefSaid && sceneT > 1) { debriefSaid = true; audio.say('BRYAN', '', 'b_spectator'); }
  if (scene === 'deploy' && sceneT > 6.4) go('fly');
  updWeather(dt, scene === 'fly' || scene === 'title' || scene === 'intro');
  const flying = scene === 'fly' && F && !F.heli.landed;
  audio.level('rotor', scene === 'fly' ? (flying ? 0.5 : 0.22) : 0);
  audio.score(dt, scene === 'fly' ? 0.07 : scene === 'debrief' ? 0.04 : 0.05, scene === 'fly' && F && STORM_TIME - F.t < 60 && !F.endT);
  audio.level('rain', scene === 'fly' ? 0.1 : scene === 'title' || scene === 'intro' ? 0.09 : scene === 'ops' ? 0.03 : 0.02);
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#05080c'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  ui = [];
  if (scene === 'title') { drawTitle(sceneT); post(); drawMute(); }
  else if (scene === 'intro') { drawIntro(sceneT); post(); drawMute(); }
  else if (scene === 'ops') { drawOps(sceneT); post(); drawMute(); }
  else if (scene === 'loadout') { drawLoadout(sceneT); post(); drawMute(); }
  else if (scene === 'deploy') { drawDeploy(sceneT); post(); drawMute(); }
  else if (scene === 'fly') drawFly();
  else if (scene === 'debrief') { drawDebrief(sceneT); post(); drawMute(); }
  ctx.restore();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { go, get F() { return F; }, get scene() { return scene; }, get survivors() { return survivors; }, setPicked(p) { picked = p; }, update, keys, audio, get opsIdx() { return opsIdx; } };
</script>
